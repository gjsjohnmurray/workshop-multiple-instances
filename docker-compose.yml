version: '3.3'

services:

  arbiter:
      container_name: arbiter
      hostname: arbiter
      image: containers.intersystems.com/intersystems/arbiter:2023.1
      init: true
      command: 
        - /usr/local/etc/irissys/startISCAgent.sh 2188

  mirror-a:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: mirrorA
    depends_on:
      - arbiter
    ports:
    - "52775:52773"
    - "51775:1972"
    volumes:
    - ./sharedA:/shared
    - ./install:/install
    - ./management:/management
    command: 
      --check-caps false
      --key /install/iris.key
      -a /install/installer.sh
    environment:
    - ISC_DATA_DIRECTORY=/shared/durable
    hostname: mirrorA

  mirror-b:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: mirrorB
    depends_on:
      - arbiter
      - mirror-a
    ports:
    - "52776:52773"
    - "51776:1972"
    volumes:
    - ./sharedB:/shared
    - ./install:/install
    - ./management:/management
    command: 
      --check-caps false
      --key /install/iris.key
      -a /install/installer.sh
    environment:
    - ISC_DATA_DIRECTORY=/shared/durable
    hostname: mirrorB
  
  mirror-dr:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: mirrorDR
    depends_on:
      - arbiter
      - mirror-a
      - mirror-b
    ports:
    - "52777:52773"
    - "51777:1972"
    volumes:
    - ./sharedDR:/shared
    - ./install:/install
    - ./management:/management
    command: 
      --check-caps false
      --key /install/iris.key
      -a /install/installer.sh
    environment:
    - ISC_DATA_DIRECTORY=/shared/durable
    hostname: mirrorDR
